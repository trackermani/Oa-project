spring:
  application:
    name: oa-server

  datasource:
    url: jdbc:sqlserver://${DB_HOST:52.79.189.228}:${DB_PORT:1433};databaseName=${DB_NAME:SEANERGY_PARTNER_DEV};encrypt=true;trustServerCertificate=true
    username: ${DB_USER:sp-dev}
    password: ${DB_PASSWORD:}
    hikari:
      read-only: true
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect

server:
  port: 8090

# Claude API
claude:
  api-key: ${CLAUDE_API_KEY:}
  model: ${CLAUDE_MODEL:claude-haiku-4-5-20251001}

# 파일 감시
file-watcher:
  watch-dir: ${WATCH_DIR:C:/UploadFiles/Seanergy}
  supported-extensions: pdf,jpg,jpeg,png

# 알림
notification:
  type: ${NOTIFICATION_TYPE:log}
