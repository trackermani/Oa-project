<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>OA - Claude 테스트</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; height: 100vh; display: flex; flex-direction: column; }
        header { background: #1a1a2e; color: white; padding: 16px 24px; font-size: 18px; font-weight: bold; }
        #chatBox { flex: 1; overflow-y: auto; padding: 20px; }
        .msg { margin-bottom: 12px; max-width: 70%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; }
        .user { background: #1a1a2e; color: white; margin-left: auto; border-bottom-right-radius: 4px; }
        .bot { background: white; border: 1px solid #ddd; border-bottom-left-radius: 4px; }
        .bot pre { white-space: pre-wrap; word-wrap: break-word; }
        #inputArea { display: flex; padding: 16px; background: white; border-top: 1px solid #ddd; }
        #msgInput { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; outline: none; }
        #msgInput:focus { border-color: #1a1a2e; }
        #sendBtn { margin-left: 8px; padding: 12px 24px; background: #1a1a2e; color: white; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; }
        #sendBtn:hover { background: #16213e; }
        #sendBtn:disabled { background: #999; cursor: not-allowed; }
        .loading { color: #999; font-style: italic; }
    </style>
</head>
<body>
    <header>OA - Claude 테스트</header>
    <div id="chatBox"></div>
    <div id="inputArea">
        <input id="msgInput" type="text" placeholder="메시지를 입력하세요..." />
        <button id="sendBtn" onclick="send()">보내기</button>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');

        msgInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') send();
        });

        async function send() {
            const message = msgInput.value.trim();
            if (!message) return;

            addMsg(message, 'user');
            msgInput.value = '';
            sendBtn.disabled = true;

            const loadingDiv = addMsg('응답 대기 중...', 'bot loading');

            try {
                const res = await fetch('/api/test/claude?message=' + encodeURIComponent(message));
                const data = await res.json();

                let text = '';
                if (data.error) {
                    text = '에러: ' + data.error;
                } else {
                    const parsed = JSON.parse(data.response);
                    text = parsed.content[0].text;
                }
                loadingDiv.innerHTML = '<pre>' + text + '</pre>';
                loadingDiv.classList.remove('loading');
            } catch (e) {
                loadingDiv.textContent = '에러: ' + e.message;
                loadingDiv.classList.remove('loading');
            }

            sendBtn.disabled = false;
            msgInput.focus();
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function addMsg(text, cls) {
            const div = document.createElement('div');
            div.className = 'msg ' + cls;
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div;
        }
    </script>
</body>
</html>
